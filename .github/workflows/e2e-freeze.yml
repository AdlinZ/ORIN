name: F02 E2E — Freeze Permission Paths

on:
  pull_request:
    paths:
      - 'orin-backend/src/main/java/com/adlin/orin/modules/agent/freeze/**'
      - 'orin-backend/src/main/java/com/adlin/orin/security/**'
      - 'orin-backend/src/main/java/com/adlin/orin/common/security/**'
      - 'orin-backend/src/main/java/com/adlin/orin/common/exception/**'
      - 'orin-backend/src/test/java/com/adlin/orin/modules/agent/freeze/**'
      - 'orin-backend/pom.xml'
      - 'orin-frontend/tests/e2e/real-backend/agent-f02-permissions.spec.js'
      - '.github/workflows/e2e-freeze.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================================
  # Job 1: Backend permission integration tests (Testcontainers MySQL)
  # =========================================================================
  backend-permission-integration:
    name: Backend Permission Integration
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('orin-backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run permission integration tests
        run: |
          cd orin-backend
          mvn -B test -Pintegration-tests \
            -Dtest="AgentFreezePermissionIntegrationTest,AgentDraftOwnershipIntegrationTest" \
            2>&1
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-permission-test-reports
          path: orin-backend/target/surefire-reports/
          retention-days: 14

  # =========================================================================
  # Job 2: Browser E2E against real backend (Docker-compose MySQL + Spring Boot)
  # =========================================================================
  browser-e2e:
    name: Browser E2E — Permission Failure Paths
    needs: backend-permission-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root_test_pw
          MYSQL_DATABASE: orindb
          MYSQL_USER: orin
          MYSQL_PASSWORD: orin_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring Boot backend
        run: |
          cd orin-backend
          # Wait for MySQL to be ready
          until mysqladmin ping -h 127.0.0.1 -u orin -porin_test_pw --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready"

          # Start backend in background with test DB config
          mvn spring-boot:run \
            -Dspring-boot.run.profiles=dev \
            -Dspring-boot.run.arguments="
              --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/orindb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
              --spring.datasource.username=orin
              --spring.datasource.password=orin_test_pw
              --spring.flyway.enabled=true
              --spring.jpa.hibernate.ddl-auto=update
              --spring.data.redis.host=localhost
              --spring.data.redis.port=6379
              --jwt.secret=ci-test-secret-key-for-e2e-only-must-be-at-least-256-bits-long
              --jwt.expiration=86400000
              --orin.default-admin.password=admin123
              --orin.rabbitmq.listeners.auto-startup=false
              --orin.collaboration.listeners.auto-startup=false
            " \
            > /tmp/backend.log 2>&1 &

          # Wait for backend to be healthy
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 2
          done

      - name: Seed test users via admin API
        run: |
          # Login as the auto-bootstrapped admin
          ADMIN_TOKEN=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | jq -r '.token')

          if [ "$ADMIN_TOKEN" = "null" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "Failed to get admin token"
            exit 1
          fi

          # Create test users (idempotent — may already exist)
          for user in '{"username":"e2e-creator","password":"test123","role":"ROLE_USER"}' \
                      '{"username":"e2e-operator","password":"test123","role":"ROLE_OPERATOR"}'; do
            curl -s -X POST http://localhost:8080/api/v1/users \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$user" || echo "User may already exist, continuing..."
          done

          echo "Test users seeded"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: orin-frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd orin-frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd orin-frontend
          npx playwright install chromium --with-deps

      - name: Run browser E2E permission tests
        run: |
          cd orin-frontend
          ORIN_REAL_BACKEND=http://localhost:8080 \
          ORIN_E2E_CREATOR_USERNAME=e2e-creator \
          ORIN_E2E_CREATOR_PASSWORD=test123 \
          ORIN_E2E_OP_USERNAME=e2e-operator \
          ORIN_E2E_OP_PASSWORD=test123 \
          npx playwright test \
            --config playwright.real-backend.config.js \
            real-backend/agent-f02-permissions.spec.js \
            2>&1

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-permission-traces
          path: orin-frontend/test-results/
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7
